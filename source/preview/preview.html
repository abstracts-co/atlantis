<!doctype html><meta name="viewport" content="width=device-width">
<title>Preview, framed the way Abstracts frames it</title>
<body style="margin:0;background:#0b0d12">
<div id="col" style="margin:0 auto;max-width:580px">
<iframe id="f" style="width:100%;border:0;display:block;height:600px"
  sandbox="allow-scripts allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-forms allow-modals allow-downloads"></iframe>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('w')) col.style.maxWidth = q.get('w') + 'px';
  f.src = '../dist/index.html' + (q.get('q') ? '?' + q.get('q') : '');
  addEventListener('message', (e) => {
    if (e.data && e.data.abstractsHeight) f.style.height = e.data.abstractsHeight + 'px';
    if (e.data && e.data.abstractsLayout === 'request') e.source.postMessage({ abstractsLayout: q.get('layout') || 'content' }, '*');
  });
</script>
